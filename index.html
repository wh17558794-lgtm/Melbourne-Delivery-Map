<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Melbourne Delivery Area</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map{height:100%;margin:0}
    body{font-family:Arial,sans-serif;background:#eef2f6}
    .title{position:absolute;z-index:1000;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);padding:10px 22px;border-radius:8px;box-shadow:0 1px 6px #667085;font-size:22px;font-weight:700;white-space:nowrap}
    .status{position:absolute;z-index:1100;top:74px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.96);padding:9px 14px;border-radius:7px;box-shadow:0 1px 5px #98a2b3;color:#344054;font-size:13px}
    .status.error{color:#b42318;border:1px solid #fda29b}
    .legend{background:rgba(255,255,255,.94);padding:10px 14px;border-radius:7px;box-shadow:0 1px 5px #98a2b3;line-height:22px}
    .sw{display:inline-block;width:18px;height:13px;margin-right:7px;border:1px solid #667085;vertical-align:-2px}
    .leaflet-tooltip.pc{background:transparent;border:0;box-shadow:none;padding:0;color:#fff;font-weight:700;font-size:10px;line-height:1;text-shadow:-1px -1px 1px #344054,1px -1px 1px #344054,-1px 1px 1px #344054,1px 1px 1px #344054;white-space:nowrap}
    .leaflet-tooltip.pc:before{display:none}
    .leaflet-popup-content{line-height:1.45}
    .static-map .leaflet-control-zoom{display:none}
    @media (max-width:640px){
      .title{top:10px;padding:8px 14px;font-size:17px}
      .status{top:58px}
      .legend{font-size:12px;padding:8px 10px}
    }
  </style>
</head>
<body>
  <div class="title">Melbourne Delivery Area</div>
  <div class="status" id="status" role="status">Loading official postcode boundaries…</div>
  <div id="map" aria-label="Interactive Melbourne postcode delivery map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const VICMAP_ROOT='https://services-ap1.arcgis.com/P744lA0wf4LlBZ84/arcgis/rest/services/Vicmap_Admin/FeatureServer';
    const zoneByPostcode={"3000":"Standard","3002":"Standard","3003":"Standard","3004":"Standard","3006":"Standard","3008":"Standard","3011":"Standard","3012":"Standard","3013":"Standard","3015":"Standard","3016":"Standard","3018":"Standard","3019":"Standard","3020":"Standard","3021":"Standard","3022":"Standard","3023":"Additional charge","3025":"Standard","3026":"Standard","3027":"Additional charge","3028":"Standard","3029":"Additional charge","3030":"Additional charge","3031":"Standard","3032":"Standard","3033":"Standard","3034":"Standard","3036":"Standard","3037":"Additional charge","3038":"Standard","3039":"Standard","3040":"Standard","3041":"Standard","3042":"Standard","3043":"Standard","3044":"Standard","3045":"Standard","3046":"Standard","3047":"Standard","3048":"Additional charge","3049":"Additional charge","3051":"Standard","3052":"Standard","3053":"Standard","3054":"Standard","3055":"Standard","3056":"Standard","3057":"Standard","3058":"Standard","3059":"Additional charge","3060":"Standard","3061":"Additional charge","3062":"Additional charge","3065":"Standard","3066":"Standard","3067":"Standard","3068":"Standard","3070":"Standard","3071":"Standard","3072":"Standard","3073":"Standard","3074":"Additional charge","3075":"Additional charge","3076":"Additional charge","3078":"Standard","3079":"Standard","3081":"Standard","3082":"Additional charge","3083":"Standard","3084":"Standard","3085":"Standard","3087":"Standard","3088":"Standard","3089":"Additional charge","3090":"Additional charge","3091":"Additional charge","3093":"Standard","3094":"Standard","3096":"Additional charge","3097":"Additional charge","3101":"Standard","3102":"Standard","3103":"Standard","3104":"Standard","3105":"Standard","3106":"Standard","3107":"Standard","3108":"Standard","3109":"Standard","3111":"Standard","3113":"Additional charge","3114":"Additional charge","3115":"Additional charge","3121":"Standard","3122":"Standard","3123":"Standard","3124":"Standard","3125":"Standard","3126":"Standard","3127":"Standard","3128":"Standard","3129":"Standard","3130":"Standard","3131":"Standard","3132":"Standard","3133":"Standard","3134":"Additional charge","3135":"Additional charge","3136":"Additional charge","3137":"Additional charge","3141":"Standard","3142":"Standard","3143":"Standard","3144":"Standard","3145":"Standard","3146":"Standard","3147":"Standard","3148":"Standard","3149":"Standard","3150":"Standard","3151":"Standard","3152":"Additional charge","3153":"Additional charge","3154":"Additional charge","3155":"Additional charge","3156":"Additional charge","3161":"Standard","3162":"Standard","3163":"Standard","3165":"Standard","3166":"Standard","3167":"Standard","3168":"Standard","3169":"Standard","3170":"Standard","3171":"Standard","3172":"Additional charge","3173":"Additional charge","3174":"Additional charge","3175":"Additional charge","3177":"Additional charge","3178":"Additional charge","3179":"Additional charge","3180":"Additional charge","3181":"Standard","3182":"Standard","3183":"Standard","3184":"Standard","3185":"Standard","3186":"Standard","3187":"Standard","3188":"Additional charge","3189":"Additional charge","3190":"Additional charge","3191":"Additional charge","3192":"Additional charge","3193":"Additional charge","3194":"Additional charge","3195":"Additional charge","3196":"Additional charge","3197":"Additional charge","3202":"Additional charge","3204":"Standard","3205":"Standard","3206":"Standard","3207":"Standard","3335":"Additional charge","3336":"Additional charge","3337":"Additional charge","3338":"Additional charge","3802":"Additional charge","3803":"Additional charge","3804":"Additional charge","3805":"Additional charge","3806":"Additional charge","3975":"Additional charge","3976":"Additional charge"};
    const postcodeBatches=[["3000","3002","3003","3004","3006","3008","3011","3012","3013","3015","3016","3018","3019","3020","3021","3022","3023","3025","3026","3027","3028","3029","3030","3031","3032","3033","3034","3036","3037","3038","3039","3040","3041","3042","3043","3044","3045","3046","3047","3048","3049","3051","3052","3053","3054"],["3055","3056","3057","3058","3059","3060","3061","3062","3065","3066","3067","3068","3070","3071","3072","3073","3074","3075","3076","3078","3079","3081","3082","3083","3084","3085","3087","3088","3089","3090","3091","3093","3094","3096","3097","3101","3102","3103","3104","3105","3106","3107","3108","3109","3111"],["3113","3114","3115","3121","3122","3123","3124","3125","3126","3127","3128","3129","3130","3131","3132","3133","3134","3135","3136","3137","3141","3142","3143","3144","3145","3146","3147","3148","3149","3150","3151","3152","3153","3154","3155","3156","3161","3162","3163","3165","3166","3167","3168","3169","3170"],["3171","3172","3173","3174","3175","3177","3178","3179","3180","3181","3182","3183","3184","3185","3186","3187","3188","3189","3190","3191","3192","3193","3194","3195","3196","3197","3202","3204","3205","3206","3207","3335","3336","3337","3338","3802","3803","3804","3805","3806","3975","3976"]];
    const localityZones={'ELTHAM':'Standard','ELTHAM NORTH':'Standard','RESEARCH':'Additional charge'};
    const staticMode=new URLSearchParams(location.search).has('static');
    if(staticMode) document.body.classList.add('static-map');

    const map=L.map('map',{zoomControl:true,closePopupOnClick:false,preferCanvas:true});
    const renderer=L.canvas({padding:.5});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors | Boundaries: <a href="https://www.land.vic.gov.au/maps-and-spatial/spatial-data/vicmap-catalogue/vicmap-admin" target="_blank" rel="noopener">Vicmap Admin</a>, State of Victoria'
    }).addTo(map);

    const statusElement=document.getElementById('status');
    const postcodeLayers=[];
    let layer=null;
    let openLayer=null;

    function buildQueryUrl(layerId,where,outFields){
      const query=new URLSearchParams({
        where,
        outFields,
        returnGeometry:'true',
        outSR:'4326',
        geometryPrecision:'6',
        f:'geojson'
      });
      return `${VICMAP_ROOT}/${layerId}/query?${query}`;
    }

    async function fetchGeoJson(layerId,where,outFields){
      const response=await fetch(buildQueryUrl(layerId,where,outFields));
      if(!response.ok) throw new Error(`Vicmap request failed (${response.status})`);
      const data=await response.json();
      if(data.error) throw new Error(data.error.message||'Vicmap returned an error');
      return data;
    }

    async function loadAreas(){
      const postcodeRequest=Promise.all(postcodeBatches.map(batch=>{
        const values=batch.map(postcode=>`'${postcode}'`).join(',');
        return fetchGeoJson(14,`postcode IN (${values})`,'postcode');
      }));
      const localityRequest=fetchGeoJson(11,"locality_name IN ('ELTHAM','ELTHAM NORTH','RESEARCH')",'locality_name');
      const [postcodeCollections,localityCollection]=await Promise.all([postcodeRequest,localityRequest]);

      const features=postcodeCollections.flatMap(collection=>collection.features);
      features.forEach(feature=>{
        const postcode=feature.properties.postcode;
        feature.properties={postcode,zone:zoneByPostcode[postcode]};
      });

      localityCollection.features.forEach(feature=>{
        const suburb=feature.properties.locality_name;
        feature.properties={
          postcode:'3095',
          suburb,
          zone:localityZones[suburb],
          showLabel:suburb==='ELTHAM'
        };
        features.push(feature);
      });
      return {type:'FeatureCollection',features};
    }

    function boundaryWeight(){
      const zoom=map.getZoom();
      if(zoom>=16) return 2.2;
      if(zoom>=14) return 1.8;
      if(zoom>=12) return 1.45;
      return 1.15;
    }

    function featureStyle(feature){
      return {
        renderer,
        color:'#475467',
        opacity:.92,
        weight:boundaryWeight(),
        fillColor:feature.properties.zone==='Standard'?'#D92D20':'#F79009',
        fillOpacity:.5,
        smoothFactor:.35,
        lineJoin:'round'
      };
    }

    function addFeatureInteraction(feature,path){
      const props=feature.properties;
      const suburbLine=props.suburb?`<br>${props.suburb}`:'';
      const popupHtml=`<b>Postcode ${props.postcode}</b>${suburbLine}<br>${props.zone}`;
      path.on('click',event=>{
        if(openLayer){
          map.closePopup();
          openLayer=null;
          return;
        }
        L.popup({closeButton:true})
          .setLatLng(event.latlng)
          .setContent(popupHtml)
          .openOn(map);
        openLayer=path;
      });
      path.on({
        mouseover:()=>path.setStyle({fillOpacity:.64,color:'#344054'}),
        mouseout:()=>path.setStyle(featureStyle(feature))
      });
      if(!props.suburb||props.showLabel){
        path.bindTooltip(props.postcode,{
          permanent:true,
          direction:'top',
          offset:[0,-4],
          className:'pc',
          opacity:1
        });
        postcodeLayers.push(path);
      }
    }

    function updatePostcodeLabels(){
      const show=staticMode||map.getZoom()>=12;
      postcodeLayers.forEach(path=>show?path.openTooltip():path.closeTooltip());
    }

    function updateBoundaryWeight(){
      if(layer) layer.setStyle(featureStyle);
    }

    async function initialise(){
      try{
        const areas=await loadAreas();
        layer=L.geoJSON(areas,{
          bubblingMouseEvents:false,
          style:featureStyle,
          onEachFeature:addFeatureInteraction
        }).addTo(map);
        map.fitBounds(layer.getBounds(),{padding:[35,35]});
        map.on('zoomend',()=>{
          updatePostcodeLabels();
          updateBoundaryWeight();
        });
        map.on('click',()=>{
          if(openLayer) map.closePopup();
          openLayer=null;
        });
        map.on('popupclose',()=>{openLayer=null});
        updatePostcodeLabels();
        statusElement.hidden=true;
      }catch(error){
        console.error(error);
        statusElement.textContent='Official boundary data could not be loaded. Please refresh to try again.';
        statusElement.classList.add('error');
        map.setView([-37.8136,144.9631],10);
      }
    }

    const legend=L.control({position:'bottomright'});
    legend.onAdd=()=>{
      const element=L.DomUtil.create('div','legend');
      element.innerHTML='<span class="sw" style="background:#D92D20"></span>Standard&nbsp;&nbsp;&nbsp;<span class="sw" style="background:#F79009"></span>Additional charge';
      return element;
    };
    legend.addTo(map);
    initialise();
  </script>
</body>
</html>
