<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Melbourne Delivery Area</title>
  <style>
    html,body,#map{height:100%;margin:0}
    body{font-family:Arial,sans-serif;background:#eef2f6}

    .legend{background:rgba(255,255,255,.94);padding:10px 14px;border-radius:7px;box-shadow:0 1px 5px #98a2b3;line-height:22px}
    .sw{display:inline-block;width:18px;height:13px;margin-right:7px;border:1px solid #667085;vertical-align:-2px}

    .search-panel{position:absolute;z-index:1050;top:76px;left:54px;width:min(420px,calc(100vw - 74px));max-height:calc(100vh - 108px);overflow:hidden;box-sizing:border-box;border:1px solid rgba(148,163,184,.45);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 18px 48px rgba(15,23,42,.18),0 2px 8px rgba(15,23,42,.08);backdrop-filter:blur(14px);color:#0f172a}

    .search-panel.collapsed{width:auto}
    .search-panel.collapsed .search-body{display:none}
    .search-panel.collapsed .search-heading{padding:11px 12px}
    .search-panel.collapsed .search-icon,.search-panel.collapsed .search-subtitle{display:none}
    .search-heading{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 16px 14px;background:linear-gradient(135deg,rgba(239,246,255,.95),rgba(255,255,255,.92) 62%);border-bottom:1px solid #e2e8f0}
    .search-title-wrap{display:flex;align-items:center;min-width:0;gap:11px}
    .search-icon{display:flex;flex:0 0 38px;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#2563eb,#1d4ed8);box-shadow:0 6px 14px rgba(37,99,235,.24);color:#fff}
    .search-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .search-title-text{display:flex;min-width:0;flex-direction:column;gap:2px}
    .search-heading strong{font-size:16px;line-height:1.25;letter-spacing:.01em}
    .search-subtitle{overflow:hidden;color:#64748b;font-size:11px;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
    .panel-toggle{display:flex;flex:0 0 30px;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:1px solid #cbd5e1;border-radius:9px;background:rgba(255,255,255,.88);box-shadow:0 1px 2px rgba(15,23,42,.04);color:#475569;font-size:18px;line-height:1;cursor:pointer;transition:.18s ease}
    .panel-toggle:hover{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}
    .search-body{max-height:calc(100vh - 183px);overflow:auto;padding:14px 16px 16px;scrollbar-width:thin;scrollbar-color:#94a3b8 transparent}
    .search-help{position:relative;margin:0 0 12px;padding:9px 10px 9px 34px;border:1px solid #dbeafe;border-radius:10px;background:#eff6ff;color:#475569;font-size:11.5px;line-height:1.5}
    .search-help:before{content:'i';position:absolute;top:10px;left:11px;display:flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#2563eb;color:#fff;font:700 10px/1 Arial}
    .input-shell{overflow:hidden;border:1px solid #cbd5e1;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.04);transition:border-color .18s ease,box-shadow .18s ease}
    .input-shell:focus-within{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
    .input-label{display:flex;align-items:center;justify-content:space-between;padding:9px 11px 7px;border-bottom:1px solid #eef2f7;color:#334155;font-size:11.5px;font-weight:700}
    .input-count{padding:3px 8px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:10.5px;font-weight:700}
    .search-input{display:block;width:100%;min-height:150px;max-height:300px;resize:vertical;box-sizing:border-box;padding:10px 11px;border:0;outline:0;background:#fff;color:#0f172a;font:13px/1.55 Arial,sans-serif;scrollbar-width:thin;scrollbar-color:#94a3b8 transparent}
    .search-input::placeholder{color:#94a3b8}
    .input-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-top:1px solid #eef2f7;background:#f8fafc;color:#64748b;font-size:10.5px}
    .keyboard-hint{white-space:nowrap}
    kbd{display:inline-block;min-width:16px;padding:1px 4px;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;background:#fff;color:#475569;font:10px/1.3 Arial;text-align:center}
    .search-actions{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:9px;margin-top:12px}
    .boundary-toggle{width:100%;margin-top:9px;border-color:#d6b978!important;background:#fffbeb!important;color:#7a4e00!important;box-shadow:0 1px 3px rgba(122,78,0,.08)!important}
    .boundary-toggle:hover:not(:disabled){border-color:#c7952d!important;background:#fff7d6!important;box-shadow:0 4px 10px rgba(122,78,0,.12)!important}
    .boundary-toggle.active{border-color:#a66b00!important;background:#fef3c7!important;color:#664100!important;box-shadow:0 0 0 2px rgba(242,177,52,.18)!important}
    .boundary-toggle:disabled{cursor:not-allowed!important;opacity:.52}
    .suburb-tag-toggle{width:100%;margin-top:9px;border-color:#cbd5e1!important;background:#fff!important;color:#334155!important;box-shadow:0 1px 3px rgba(15,23,42,.08)!important}
    .suburb-tag-toggle:hover:not(:disabled){border-color:#93c5fd!important;background:#f8fbff!important;box-shadow:0 4px 10px rgba(37,99,235,.12)!important}
    .suburb-tag-toggle.active{border-color:#2563eb!important;background:#eff6ff!important;color:#1d4ed8!important;box-shadow:0 0 0 2px rgba(37,99,235,.13)!important}
    .suburb-tag-toggle:disabled{cursor:not-allowed!important;opacity:.52}
    .result-mark-toggle{width:100%;margin-top:9px;border-color:#99c7e8!important;background:#f0f9ff!important;color:#075985!important;box-shadow:0 1px 3px rgba(14,116,144,.1)!important}
    .result-mark-toggle:hover:not(:disabled){border-color:#38bdf8!important;background:#e0f2fe!important;box-shadow:0 4px 10px rgba(14,116,144,.16)!important}
    .result-mark-toggle.ready{border-color:#0284c7!important;background:#e0f2fe!important;color:#075985!important;box-shadow:0 0 0 2px rgba(14,165,233,.15)!important}
    .result-mark-toggle:disabled{cursor:not-allowed!important;opacity:.52}
    .sheet-import-toggle{width:100%;margin-top:12px;border-color:#86c5a4!important;background:#f0fdf4!important;color:#166534!important;box-shadow:0 1px 3px rgba(22,101,52,.08)!important}
    .sheet-import-toggle:hover:not(:disabled){border-color:#22c55e!important;background:#dcfce7!important;box-shadow:0 4px 10px rgba(22,101,52,.14)!important}
    .sheet-import-toggle.connected{border-color:#16a34a!important;background:#dcfce7!important;color:#166534!important;box-shadow:0 0 0 2px rgba(34,197,94,.13)!important}
    .sheet-import-toggle:disabled{cursor:wait!important;opacity:.62}
    .search-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 13px;border:1px solid transparent;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 5px 12px rgba(37,99,235,.2);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
    .search-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .search-button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 16px rgba(37,99,235,.24)}
    .search-button:active:not(:disabled){transform:translateY(0)}
    .search-button.secondary{border-color:#cbd5e1;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.05);color:#475569}
    .search-button.secondary:hover:not(:disabled){border-color:#94a3b8;background:#f8fafc;box-shadow:0 4px 9px rgba(15,23,42,.07)}
    .search-button:disabled{cursor:wait;opacity:.58;transform:none}
    .search-results{display:none;margin-top:11px;padding:11px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:#475569;font-size:11.5px;line-height:1.5}
    .search-results.visible{display:block}
    .search-results.error{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
    .result-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .result-metric{display:flex;min-width:0;flex-direction:column;align-items:center;padding:8px 5px;border:1px solid #dbeafe;border-radius:9px;background:#fff;text-align:center}
    .result-metric strong{color:#1d4ed8;font-size:17px;line-height:1.1}
    .result-metric span{margin-top:3px;color:#64748b;font-size:10px;white-space:nowrap}
    .result-errors{max-height:112px;overflow:auto;margin:9px 0 0;padding:8px 8px 8px 25px;border:1px solid #fde68a;border-radius:9px;background:#fffbeb;color:#92400e}
    .result-errors li+li{margin-top:4px}
    .search-progress{height:4px;margin-top:10px;overflow:hidden;border-radius:999px;background:#dbeafe}
    .search-progress>span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#0ea5e9);transition:width .2s ease}
    .google-legend{position:absolute;z-index:1050;right:12px;bottom:28px}
    .postcode-label{color:#fff!important;font-size:10px!important;font-weight:700!important;text-shadow:-1px -1px 1px #344054,1px -1px 1px #344054,-1px 1px 1px #344054,1px 1px 1px #344054}
    .delivery-address-pin{position:relative;width:21px;height:30px;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(16,24,40,.28))}
    .delivery-address-pin svg{display:block;width:21px;height:30px}
    .delivery-address-pin.is-marked svg path:first-of-type{fill:#2f80ed}
    .delivery-address-pin.is-marked svg path:nth-of-type(2){fill:#2f80ed;stroke:#175cd3}
    .delivery-address-pin.is-marked svg circle{fill:#175cd3}
    .delivery-address-pin.is-pending:after{content:'';position:absolute;left:-5px;top:-5px;width:29px;height:35px;border:2px solid #0ea5e9;border-radius:50% 50% 46% 46%;box-shadow:0 0 0 3px rgba(14,165,233,.16);pointer-events:none}
    .delivery-suburb-label{box-sizing:border-box;padding:5px 9px;border:1px solid rgba(152,162,179,.72);border-radius:7px;background:rgba(255,255,255,.94);box-shadow:0 2px 7px rgba(16,24,40,.18);color:#27364b;font-family:Arial,sans-serif;font-size:12px;font-weight:600;line-height:15px;letter-spacing:.01em;white-space:nowrap;pointer-events:auto;cursor:pointer;backdrop-filter:blur(3px)}
    .delivery-suburb-label:before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#ea4335;box-shadow:0 0 0 1px rgba(179,38,30,.28);vertical-align:1px}
    .delivery-suburb-label.is-marked{border-color:rgba(56,189,248,.82);background:rgba(239,249,255,.96);color:#075985;box-shadow:0 2px 8px rgba(14,116,144,.2)}
    .delivery-suburb-label.is-marked:before{background:#2f80ed;box-shadow:0 0 0 1px rgba(23,92,211,.3)}
    .delivery-suburb-label.is-pending{outline:2px solid rgba(14,165,233,.76);outline-offset:2px}
    .delivery-suburb-label.is-detailed{font-size:13px;line-height:16px}
    .status.api-key-setup{top:50%;width:min(420px,calc(100vw - 44px));transform:translate(-50%,-50%);box-sizing:border-box;padding:18px;border:1px solid #bfdbfe;border-radius:14px;box-shadow:0 18px 48px rgba(15,23,42,.22);line-height:1.5}
    .api-key-setup strong{display:block;margin-bottom:5px;color:#0f172a;font-size:16px}
    .api-key-setup p{margin:0 0 11px;color:#64748b}
    .api-key-row{display:flex;gap:8px}
    .api-key-row input{min-width:0;flex:1;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;outline:0}
    .api-key-row input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
    .api-key-row button{padding:9px 13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
    .api-key-note{display:block;margin-top:9px;color:#64748b;font-size:10.5px}

      .search-panel{top:58px;left:10px;width:calc(100vw - 20px);max-height:calc(100vh - 76px)}
      .search-heading{padding:14px 13px 12px}
      .search-body{max-height:calc(100vh - 151px);padding:12px 13px 14px}
      .search-input{min-height:125px}
    }
  </style>
</head>
<body>

  <div class="status" id="status" role="status">Loading official postcode boundaries...</div>

    </div>
    <div class="search-body">
      <p class="search-help">每行输入一个完整地址或 suburb。地址会显示编号点位；Unit、Lot、楼层和斜线前的单位号会自动忽略，只按街道门牌号检索。</p>

        <div class="input-footer"><span>每行输入一个地址或 suburb</span><span class="keyboard-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 查找</span></div>
      </div>
      <button class="search-button secondary sheet-import-toggle" id="sheetImportButton" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4Z"></path><path d="M4 9h16M9 4v16M14 4v16"></path></svg><span id="sheetImportLabel">从 Google Sheets 导入</span></button>
      <div class="search-actions">
        <button class="search-button" id="searchButton" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><span>查找并显示</span></button>
        <button class="search-button secondary" id="clearButton" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path></svg><span>清空</span></button>
      </div>
      <button class="search-button secondary boundary-toggle" id="boundaryToggleButton" type="button" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></svg><span id="boundaryToggleLabel">显示650个 Suburb 边界</span></button>
      <button class="search-button secondary suburb-tag-toggle" id="suburbTagToggleButton" type="button" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z"></path><path d="M8 9h8M8 12h5"></path></svg><span id="suburbTagToggleLabel">显示 Suburb 名称</span></button>
      <button class="search-button secondary result-mark-toggle" id="resultMarkButton" type="button" disabled title="按住 Ctrl 点击水滴或 Tag 后进行标记"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 14 6 6L20 6"></path><path d="M4 6h7"></path></svg><span id="resultMarkLabel">标记选中结果</span></button>
      <div class="search-progress" id="searchProgress" hidden><span></span></div>
      <div class="search-results" id="searchResults" role="status" aria-live="polite"></div>
    </div>
  </section>
  <div id="map" aria-label="Interactive Melbourne postcode delivery map"></div>
  <div class="legend google-legend" id="legend"></div>

    function buildQueryUrl(root,layerId,parameters,format='geojson'){
      const query=new URLSearchParams({...parameters,f:format});
      return `${root}/${layerId}/query?${query}`;
    }

    function wait(milliseconds){
      return new Promise(resolve=>setTimeout(resolve,milliseconds));
    }

    async function fetchService(root,layerId,parameters,format='geojson'){
      const url=buildQueryUrl(root,layerId,parameters,format);
      let lastError=null;
      for(let attempt=0;attempt<3;attempt++){
        try{
          const response=await fetch(url);
          if(!response.ok) throw new Error(`Vicmap request failed (${response.status})`);
          const data=await response.json();
          if(data.error){
            const message=data.error.message||'Vicmap returned an error';
            const details=(data.error.details||[]).filter(Boolean).join('; ');
            const error=new Error(details?`${message}: ${details}`:message);
            error.retryable=/unable to perform query|temporar|busy|timeout/i.test(error.message);
            throw error;
          }
          return data;
        }catch(error){
          lastError=error;
          const retryable=error.retryable||
            /failed to fetch|network|429|50[0234]|timeout/i.test(error.message);
          if(!retryable||attempt===2) throw error;
          await wait(350*(attempt+1));
        }
      }
      throw lastError;
    }

      const [postcodeCollections,localityCollection]=await Promise.all([postcodeRequest,localityRequest]);

    function normaliseAddress(value){
      let address=normaliseText(value)
        .replace(/\bAUSTRALIA\b/g,' ')
        .replace(/\bVICTORIA\b/g,' ')
        .replace(/\bVIC\b/g,' ');
      const roadTypes={
        ' RD ':' ROAD ',
        ' ST ':' STREET ',
        ' PDE ':' PARADE ',
        ' AVE ':' AVENUE ',
        ' AV ':' AVENUE ',
        ' CRES ':' CRESCENT ',

        ' SQ ':' SQUARE ',
        ' TRK ':' TRACK ',

      };
      address=` ${address} `;
      Object.entries(roadTypes).forEach(([shortName,longName])=>{

    const ROAD_TYPES=[
      'ALLEYWAY','APPROACH','BOULEVARD','BROADWAY','CAUSEWAY','CIRCUIT',
      'CONCOURSE','CRESCENT','CUL-DE-SAC','DISTRIBUTOR','DRIVE','ENTRANCE',

    ].sort((a,b)=>b.length-a.length);

    function parseAddress(value){
      const query=normaliseAddress(value);
      let working=query;
      const postcodeMatch=working.match(/\b(3\d{3})\s*$/);
      const postcode=postcodeMatch?.[1]||'';
      if(postcodeMatch) working=working.slice(0,postcodeMatch.index).trim();

      let unitNumber=null;
      let prefix=working.match(
        /^(?:UNIT|APT|APARTMENT|SHOP|SUITE|FLAT)\s+[A-Z]*?(\d+)[A-Z-]*\s+/
      );
      if(prefix){
        unitNumber=Number(prefix[1]);
        working=working.slice(prefix[0].length);
      }else{
        prefix=working.match(/^U\s*(\d+)[A-Z-]*\s+/);
        if(prefix){
          unitNumber=Number(prefix[1]);
          working=working.slice(prefix[0].length);
        }else{
          prefix=working.match(/^([A-Z]*?)(\d+)[A-Z-]*\s*\/\s*/);
          if(prefix){
            unitNumber=Number(prefix[2]);
            working=working.slice(prefix[0].length);
          }
        }
      }

      working=working
        .replace(/^LEVEL\s+[A-Z0-9-]+\s+/,'')
        .replace(/^(?:LOT\s+[A-Z0-9-]+\s+)+/,'')
        .trim();

      const typePattern=ROAD_TYPES
        .map(type=>type.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
        .join('|');
      const match=working.match(
        new RegExp(`^(\\d+)([A-Z]?)(?:\\s*-\\s*(\\d+)([A-Z]?))?\\s+(.+?)\\s+(${typePattern})\\b\\s*(.*)$`)
      );
      if(!match) return null;
      return {
        query,
        unitNumber,
        houseNumber:Number(match[1]),
        houseSuffix:match[2]||'',
        houseNumberEnd:match[3]?Number(match[3]):null,
        houseSuffixEnd:match[4]||'',
        roadName:match[5],
        roadType:match[6],
        locality:match[7].trim(),
        postcode
      };
    }

    function escapeSql(value){

    function registerSuburbPath(feature,path){
      const name=normaliseText(feature.properties.locality_name||'');
      if(!suburbLookup.has(name)) suburbLookup.set(name,[]);
      suburbLookup.get(name).push(path);

        if(openLayer){

      path.on({

    async function ensureSuburbBoundaries(rawNames=[]){
      ensureSuburbLayer();
      const names=[...new Set(
        rawNames
          .map(normaliseSuburbInput)
          .filter(Boolean)
          .filter(name=>!suburbLookup.has(name))
      )];
      if(!names.length) return;

      const chunkSize=40;
      const requests=[];
      for(let start=0;start<names.length;start+=chunkSize){
        const chunk=names.slice(start,start+chunkSize).sort();
        const key=chunk.join('|');
        if(!suburbBoundaryRequests.has(key)){
          const values=chunk.map(name=>`'${escapeSql(name)}'`).join(',');
          const request=fetchAdminGeoJson(
            11,
            `locality_name IN (${values})`,
            'locality_name'
          ).then(data=>{
            suburbLayer.addData(data);
            return data;
          }).catch(error=>{
            suburbBoundaryRequests.delete(key);
            throw error;
          });
          suburbBoundaryRequests.set(key,request);
        }
        requests.push(suburbBoundaryRequests.get(key));
      }
      await Promise.all(requests);
    }

    async function ensureSpecificSuburb(rawName){
      const requested=normaliseSuburbInput(rawName);
      if(suburbLookup.has(requested)) return requested;

      const partial=[...suburbLookup.keys()].filter(name=>name.includes(requested)||requested.includes(name));
      if(partial.length===1) return partial[0];

      const data=await fetchAdminGeoJson(
        11,
        `UPPER(locality_name)='${escapeSql(requested)}'`,
        'locality_name'
      );
      if(!data.features?.length) return null;
      suburbLayer.addData(data);
      return normaliseText(data.features[0].properties.locality_name);
    }

    async function getSuburbZone(name){
      if(localityZones[name]) return localityZones[name];
      if(!suburbZoneCache.has(name)){
        const request=(async()=>{
          const data=await fetchService(VICMAP_ADDRESS_ROOT,0,{
            where:`UPPER(locality_name)='${escapeSql(name)}'`,
            outFields:'postcode',
            returnGeometry:'false',
            resultRecordCount:'200'
          },'json');
          const postcodes=(data.features||[])
            .map(feature=>feature.attributes?.postcode)
            .filter(Boolean);
          const zones=new Set(postcodes.map(postcode=>zoneByPostcode[postcode]).filter(Boolean));
          if(zones.size===1) return [...zones][0];
          if(zones.size>1) return 'Mixed';
          return 'Outside delivery area';
        })().catch(error=>{
          suburbZoneCache.delete(name);
          throw error;
        });
        suburbZoneCache.set(name,request);
      }
      return suburbZoneCache.get(name);
    }

    function mergeSuburbSelection(name,zone,lineNumber){
      const existing=selectedSuburbs.get(name);
      if(!existing){
        selectedSuburbs.set(name,{zone,lineNumbers:[lineNumber]});
        return;
      }
      existing.lineNumbers.push(lineNumber);
      if(existing.zone!==zone&&zone!=='Outside delivery area'&&existing.zone!=='Outside delivery area'){
        existing.zone='Mixed';
      }else if(existing.zone==='Outside delivery area'&&zone!=='Outside delivery area'){
        existing.zone=zone;
      }
    }

    function scoreAddressCandidate(feature,query,parsed){
      const props=feature.properties||{};
      const candidate=normaliseAddress(props.ezi_address||'');
      let score=0;
      if(candidate===query) score+=1000;
      else if(candidate.startsWith(`${query} `)) score+=900;
      const queryTokens=query.split(' ');
      score+=queryTokens.filter(token=>candidate.includes(token)).length*10;
      if(parsed){
        if(Number(props.house_number_1)===parsed.houseNumber) score+=120;
        if(normaliseText(props.road_name||'')===parsed.roadName) score+=120;
        if(normaliseText(props.road_type||'')===parsed.roadType) score+=60;
        if(normaliseText(props.locality_name||'')===parsed.locality) score+=100;
        if(String(props.postcode||'')===parsed.postcode) score+=100;
      }
      if(props.is_primary==='Y') score+=3;
      if(props.property_status==='A') score+=2;
      return score;
    }

    function addressWhere(parsed,{loose=false,minimal=false}={}){
      const parts=[`house_number_1=${parsed.houseNumber}`];
      if(parsed.houseSuffix&&!minimal){
        parts.push(`house_suffix_1='${escapeSql(parsed.houseSuffix)}'`);
      }
      if(!minimal){
        parts.push(`road_name='${escapeSql(parsed.roadName)}'`);
        if(!loose) parts.push(`road_type='${escapeSql(parsed.roadType)}'`);
      }
      if(parsed.postcode){
        parts.push(`postcode='${escapeSql(parsed.postcode)}'`);
      }else if(parsed.locality){
        parts.push(`locality_name='${escapeSql(parsed.locality)}'`);
      }
      if(!loose&&parsed.locality&&parsed.postcode){
        parts.push(`locality_name='${escapeSql(parsed.locality)}'`);
      }
      return parts.join(' AND ');
    }

    function isAddressInput(value){
      const query=normaliseAddress(value);
      return Boolean(parseAddress(value))||
        /^(?:(?:UNIT|SHOP|APT|APARTMENT|SUITE|FLAT|LEVEL)\b|U\s*\d|\d)/.test(query);
    }

    async function fetchAddressCandidates(where,resultRecordCount='100'){
      const data=await fetchService(VICMAP_ADDRESS_ROOT,0,{
        where,
        outFields:[
          'ezi_address','locality_name','postcode','is_primary','property_status',
          'house_number_1','house_number_2','house_suffix_1','road_name','road_type',
          'num_road_address'
        ].join(','),
        returnGeometry:'true',
        outSR:'4326',
        resultRecordCount
      });
      return (data.features||[]).filter(feature=>feature.geometry?.coordinates);
    }

    function selectAddressCandidate(rawAddress,candidates,relaxed=false){
      const query=normaliseAddress(rawAddress);
      const parsed=parseAddress(rawAddress);
      let pool=[...candidates];
      if(parsed){
        const sameProperty=pool.filter(feature=>{
          const props=feature.properties||{};
          return Number(props.house_number_1)===parsed.houseNumber&&
            (!parsed.postcode||String(props.postcode||'')===parsed.postcode);
        });
        if(!sameProperty.length) return null;
        pool=sameProperty;
        const sameRoad=pool.filter(feature=>{
          const props=feature.properties||{};
          return normaliseText(props.road_name||'')===parsed.roadName&&
            normaliseText(props.road_type||'')===parsed.roadType;
        });
        if(sameRoad.length) pool=sameRoad;
        else if(!relaxed) return null;
      }
      pool.sort(
        (a,b)=>scoreAddressCandidate(b,query,parsed)-scoreAddressCandidate(a,query,parsed)
      );
      if(!pool.length) return null;
      const topScore=scoreAddressCandidate(pool[0],query,parsed);
      const equallyLikely=pool.filter(
        feature=>scoreAddressCandidate(feature,query,parsed)===topScore
      );
      return {
        feature:pool[0],
        ambiguous:new Set(equallyLikely.map(item=>item.properties.ezi_address)).size>1
      };
    }

    function batchAddressWhere(parsed,minimal=false){
      const parts=[`house_number_1=${parsed.houseNumber}`];
      if(parsed.houseSuffix&&!minimal){
        parts.push(`house_suffix_1='${escapeSql(parsed.houseSuffix)}'`);
      }
      if(!minimal){
        parts.push(`road_name='${escapeSql(parsed.roadName)}'`);
        parts.push(`road_type='${escapeSql(parsed.roadType)}'`);
      }
      if(parsed.postcode){
        parts.push(`postcode='${escapeSql(parsed.postcode)}'`);
      }else if(parsed.locality){
        parts.push(`locality_name='${escapeSql(parsed.locality)}'`);
      }
      return parts.join(' AND ');
    }

    async function queryAddressChunks(items,minimal,candidates,errors){
      const chunkSize=6;
      const requests=[];
      for(let start=0;start<items.length;start+=chunkSize){
        const chunk=items.slice(start,start+chunkSize);
        const conditions=[...new Set(
          chunk.map(item=>`(${batchAddressWhere(item.parsed,minimal)})`)
        )];
        requests.push((async()=>{
          try{
            const found=await fetchAddressCandidates(conditions.join(' OR '),'2000');
            candidates.push(...found);
          }catch(error){
            chunk.forEach(item=>errors.set(item.index,error));
          }
        })());
      }
      await Promise.all(requests);
    }

    async function geocodeAddressesBatch(items){
      const results=new Map();
      const parsedItems=items
        .map(item=>({...item,parsed:parseAddress(item.input)}))
        .filter(item=>item.parsed);
      const unparsedItems=items.filter(
        item=>!parsedItems.some(parsed=>parsed.index===item.index)
      );
      const errors=new Map();
      const exactCandidates=[];
      await queryAddressChunks(parsedItems,false,exactCandidates,errors);

      const unmatched=[];
      parsedItems.forEach(item=>{
        const match=selectAddressCandidate(item.input,exactCandidates);
        if(match) results.set(item.index,{match});
        else unmatched.push(item);
      });

      if(unmatched.length){
        const fallbackCandidates=[];
        await queryAddressChunks(unmatched,true,fallbackCandidates,errors);
        unmatched.forEach(item=>{
          const match=selectAddressCandidate(item.input,fallbackCandidates,true);
          if(match) results.set(item.index,{match});
          else if(errors.has(item.index)) results.set(item.index,{error:errors.get(item.index)});
          else results.set(item.index,{match:null});
        });
      }

      await mapWithConcurrency(unparsedItems,3,async item=>{
        try{
          results.set(item.index,{match:await geocodeAddress(item.input)});
        }catch(error){
          results.set(item.index,{error});
        }
      });
      return results;
    }

    async function geocodeAddress(rawAddress){
      const query=normaliseAddress(rawAddress);
      const parsed=parseAddress(rawAddress);
      const attempts=[];
      if(parsed){
        attempts.push(addressWhere(parsed));
        attempts.push(addressWhere(parsed,{loose:true}));
        attempts.push(addressWhere(parsed,{minimal:true}));
      }else{
        attempts.push(`ezi_address LIKE '${escapeSql(query)}%'`);
      }

      let candidates=[];
      let successfulRequest=false;
      let lastError=null;
      for(const where of [...new Set(attempts)]){
        try{
          candidates=await fetchAddressCandidates(where);
          successfulRequest=true;
          if(candidates.length) break;
        }catch(error){
          lastError=error;
        }
      }
      if(!candidates.length&&!successfulRequest&&lastError) throw lastError;
      return selectAddressCandidate(rawAddress,candidates,true);
    }

    async function mapWithConcurrency(items,limit,worker,onProgress){
      const results=new Array(items.length);
      let nextIndex=0;
      let completed=0;
      async function run(){
        while(nextIndex<items.length){
          const index=nextIndex++;
          try{
            results[index]=await worker(items[index],index);
          }catch(error){
            results[index]={ok:false,input:items[index],reason:error.message||'Search failed'};
          }
          completed++;
          onProgress?.(completed,items.length);
        }
      }
      await Promise.all(Array.from({length:Math.min(limit,items.length)},run));
      return results;
    }

    function addressMarkerRadius(){
      return Math.max(5,Math.min(15,5+(map.getZoom()-10)*1.35));
    }

    function addAddressMarker(result){
      const [longitude,latitude]=result.feature.geometry.coordinates;
      const props=result.feature.properties;
      const zone=result.zone||'Outside delivery area';
      const marker=L.circleMarker([latitude,longitude],{
        renderer,
        radius:addressMarkerRadius(),
        color:'#FFFFFF',
        weight:2.5,
        fillColor:'#175CD3',
        fillOpacity:1,
        bubblingMouseEvents:false
      }).addTo(map);
      marker.bindTooltip(String(result.lineNumber),{
        permanent:true,
        direction:'center',
        className:'address-index',
        opacity:1
      });
      marker.bindPopup(
        `<b>${result.lineNumber}. ${escapeHtml(props.ezi_address)}</b><br>`+
        `${escapeHtml(props.locality_name)} · ${escapeHtml(props.postcode||'No postcode')}<br>`+
        `${escapeHtml(zone)}`
      );
      addressMarkers.push(marker);
      return marker;
    }

    function updateAddressMarkerSizes(){
      addressMarkers.forEach(marker=>marker.setRadius(addressMarkerRadius()));
    }

    function updateSearchProgress(completed,total){
      searchProgress.hidden=false;
      searchProgressBar.style.width=`${Math.round(completed/total*100)}%`;
    }

    function setSearchResult(message,errors=[],isError=false){
      searchResults.classList.toggle('error',isError);
      searchResults.classList.add('visible');
      searchResults.innerHTML=message;
      if(errors.length){
        const list=document.createElement('ul');
        list.className='result-errors';
        errors.forEach(error=>{
          const item=document.createElement('li');
          item.textContent=error;
          list.appendChild(item);
        });
        searchResults.appendChild(list);
      }
    }

    function updateLegend(){
      if(!legendElement) return;
      if(searchActive){
        legendElement.innerHTML=
          '<span class="sw" style="background:#D92D20"></span>Standard&nbsp;&nbsp;'+
          '<span class="sw" style="background:#F79009"></span>Additional charge<br>'+
          '<span class="sw" style="background:#175CD3;border-radius:50%"></span>Address';
      }else{
        legendElement.innerHTML=
          '<span class="sw" style="background:#D92D20"></span>Standard&nbsp;&nbsp;&nbsp;'+
          '<span class="sw" style="background:#F79009"></span>Additional charge';
      }
    }

    function showSearchMode(){
      searchActive=true;
      if(map.hasLayer(layer)) map.removeLayer(layer);
      if(!map.hasLayer(suburbLayer)) suburbLayer.addTo(map);
      suburbLayer.setStyle(suburbStyle);
      postcodeLayers.forEach(path=>path.closeTooltip());
      updateLegend();
    }

    function fitSearchResults(){
      const items=[...addressMarkers];
      selectedSuburbs.forEach((_,name)=>{
        (suburbLookup.get(name)||[]).forEach(path=>items.push(path));
      });
      if(!items.length) return;
      const bounds=L.featureGroup(items).getBounds();
      if(bounds.isValid()) map.fitBounds(bounds.pad(.12),{padding:[40,40],maxZoom:15});
    }

    function resetSearch(clearInput=true){
      selectedSuburbs.clear();
      addressMarkers.splice(0).forEach(marker=>map.removeLayer(marker));
      searchActive=false;
      if(suburbLayer&&map.hasLayer(suburbLayer)) map.removeLayer(suburbLayer);
      if(layer&&!map.hasLayer(layer)) layer.addTo(map);
      if(layer) layer.setStyle(featureStyle);
      if(clearInput){
        searchInput.value='';
        updateInputCount();
      }
      searchResults.className='search-results';
      searchResults.textContent='';
      searchProgress.hidden=true;
      searchProgressBar.style.width='0';
      if(openLayer) map.closePopup();
      openLayer=null;
      updatePostcodeLabels();
      updateLegend();
      if(layer) map.fitBounds(layer.getBounds(),{padding:[35,35]});
    }

    async function runBatchSearch(){
      const lines=searchInput.value
        .split(/\r?\n/)
        .map(line=>line.trim())
        .filter(Boolean);
      if(!lines.length){
        setSearchResult('请先输入至少一个地址或 suburb。',[],true);
        return;
      }

      searchButton.disabled=true;
      clearButton.disabled=true;
      searchProgressBar.style.width='0';
      searchProgress.hidden=false;
      setSearchResult(`正在处理 ${lines.length} 条信息...`);

      try{
        await ensureSuburbBoundaries();
        selectedSuburbs.clear();
        addressMarkers.splice(0).forEach(marker=>map.removeLayer(marker));

        const addressItems=lines
          .map((input,index)=>({input,index}))
          .filter(item=>isAddressInput(item.input));
        const directSuburbNames=lines
          .filter(input=>!isAddressInput(input))
          .map(normaliseSuburbInput);
        const directBoundaryRequest=ensureSuburbBoundaries(directSuburbNames);
        if(addressItems.length){
          setSearchResult(`正在批量定位 ${addressItems.length} 个地址...`);
        }
        const addressMatches=await geocodeAddressesBatch(addressItems);
        const addressSuburbNames=[...addressMatches.values()]
          .map(result=>result.match?.feature?.properties?.locality_name)
          .filter(Boolean);
        await directBoundaryRequest;
        await ensureSuburbBoundaries(addressSuburbNames);

        const results=await mapWithConcurrency(lines,4,async(input,index)=>{
          const lineNumber=index+1;
          if(isAddressInput(input)){
            const batchResult=addressMatches.get(index);
            if(batchResult?.error){
              return {ok:false,input,reason:batchResult.error.message||'地址服务查询失败'};
            }
            const match=batchResult?.match||null;
            if(!match) return {ok:false,input,reason:'未找到匹配地址'};
            const props=match.feature.properties;
            const suburbName=await ensureSpecificSuburb(props.locality_name);
            if(!suburbName) return {ok:false,input,reason:'找到地址，但未找到 suburb 边界'};
            const zone=props.postcode==='3095'
              ?localityZones[suburbName]
              :zoneByPostcode[props.postcode]||'Outside delivery area';
            mergeSuburbSelection(suburbName,zone,lineNumber);
            return {
              ok:true,
              type:'address',
              input,
              lineNumber,
              feature:match.feature,
              suburbName,
              zone,
              ambiguous:match.ambiguous
            };
          }

          const suburbName=await ensureSpecificSuburb(input);
          if(!suburbName) return {ok:false,input,reason:'未找到匹配 suburb'};
          const zone=await getSuburbZone(suburbName);
          mergeSuburbSelection(suburbName,zone,lineNumber);
          return {ok:true,type:'suburb',input,lineNumber,suburbName,zone};
        },updateSearchProgress);

        showSearchMode();
        results.filter(result=>result?.ok&&result.type==='address').forEach(addAddressMarker);
        suburbLayer.setStyle(suburbStyle);
        fitSearchResults();
        updateAddressMarkerSizes();

        const addressCount=results.filter(result=>result?.ok&&result.type==='address').length;
        const suburbCount=results.filter(result=>result?.ok&&result.type==='suburb').length;
        const failures=results.filter(result=>!result?.ok);
        const warnings=results.filter(result=>result?.ambiguous);
        const issues=[
          ...failures.map(result=>`${result.input} — ${result.reason}`),
          ...warnings.map(result=>`${result.input} — 有多个相近结果，已显示最佳匹配`)
        ];
        setSearchResult(
          '<div class="result-summary-grid">'+
            `<div class="result-metric"><strong>${addressCount}</strong><span>地址点</span></div>`+
            `<div class="result-metric"><strong>${suburbCount}</strong><span>Suburb</span></div>`+
            `<div class="result-metric"><strong>${selectedSuburbs.size}</strong><span>高亮区域</span></div>`+
          '</div>',
          issues,
          failures.length===lines.length
        );
      }catch(error){
        console.error(error);
        setSearchResult(`搜索失败：${escapeHtml(error.message||'Unknown error')}`,[],true);
      }finally{
        searchButton.disabled=false;
        clearButton.disabled=false;
        searchProgress.hidden=true;
      }
    }

    function boundaryWeight(){
      const zoom=map.getZoom();
      if(zoom>=16) return 2.2;
      if(zoom>=14) return 1.8;
      if(zoom>=12) return 1.45;
      return 1.15;
    }

    function featureStyle(feature){
      return {
        renderer,
        color:'#475467',
        opacity:.92,
        weight:boundaryWeight(),
        fillColor:feature.properties.zone==='Standard'?'#D92D20':'#F79009',
        fillOpacity:.5,
        smoothFactor:.35,
        lineJoin:'round'
      };
    }

    function addFeatureInteraction(feature,path){
      const props=feature.properties;
      const suburbLine=props.suburb?`<br>${props.suburb}`:'';
      const popupHtml=`<b>Postcode ${props.postcode}</b>${suburbLine}<br>${props.zone}`;
      path.on('click',event=>{
        if(openLayer){
          map.closePopup();
          openLayer=null;
          return;
        }
        L.popup({closeButton:true})
          .setLatLng(event.latlng)
          .setContent(popupHtml)
          .openOn(map);
        openLayer=path;
      });
      path.on({
        mouseover:()=>path.setStyle({fillOpacity:.64,color:'#344054'}),
        mouseout:()=>path.setStyle(featureStyle(feature))
      });
      if(!props.suburb||props.showLabel){
        path.bindTooltip(props.postcode,{
          permanent:true,
          direction:'top',
          offset:[0,-4],
          className:'pc',
          opacity:1
        });
        postcodeLayers.push(path);
      }
    }

    function updatePostcodeLabels(){
      const show=!searchActive&&(staticMode||map.getZoom()>=12);
      postcodeLayers.forEach(path=>show?path.openTooltip():path.closeTooltip());
    }

    function updateBoundaryWeight(){
      if(layer) layer.setStyle(featureStyle);
      if(suburbLayer) suburbLayer.setStyle(suburbStyle);
      updateAddressMarkerSizes();
    }

    async function initialise(){
      try{
        const areas=await loadAreas();
        layer=L.geoJSON(areas,{
          bubblingMouseEvents:false,
          style:featureStyle,
          onEachFeature:addFeatureInteraction
        }).addTo(map);
        map.fitBounds(layer.getBounds(),{padding:[35,35]});
        map.on('zoomend',()=>{
          updatePostcodeLabels();
          updateBoundaryWeight();
        });
        map.on('click',()=>{
          if(openLayer) map.closePopup();
          openLayer=null;
        });
        map.on('popupclose',()=>{openLayer=null});
        updatePostcodeLabels();
        statusElement.hidden=true;
        searchButton.disabled=false;
        clearButton.disabled=false;
        ensureSuburbLayer();
      }catch(error){
        console.error(error);
        statusElement.textContent='Official boundary data could not be loaded. Please refresh to try again.';
        statusElement.classList.add('error');
        map.setView([-37.8136,144.9631],10);
      }
    }

    const legend=L.control({position:'bottomright'});
    legend.onAdd=()=>{
      legendElement=L.DomUtil.create('div','legend');
      updateLegend();
      return legendElement;
    };
    legend.addTo(map);
    searchButton.disabled=true;
    clearButton.disabled=true;
    L.DomEvent.disableClickPropagation(searchPanel);
    L.DomEvent.disableScrollPropagation(searchPanel);
    panelToggle.addEventListener('click',()=>{
      const collapsed=searchPanel.classList.toggle('collapsed');
      panelToggle.textContent=collapsed?'+':'−';
      panelToggle.title=collapsed?'展开':'收起';
      panelToggle.setAttribute('aria-label',collapsed?'Expand search panel':'Collapse search panel');
    });
    searchButton.addEventListener('click',runBatchSearch);
    clearButton.addEventListener('click',()=>resetSearch(true));
    searchInput.addEventListener('input',updateInputCount);
    searchInput.addEventListener('keydown',event=>{
      if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){
        event.preventDefault();
        runBatchSearch();
      }
    });
    updateInputCount();
    initialise();
  </script>
